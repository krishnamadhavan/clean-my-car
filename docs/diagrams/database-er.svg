<?xml version="1.0" encoding="UTF-8"?>
<!--
  Clean My Car — PostgreSQL-style ER diagram (pgAdmin-like layout)
  Update this file whenever tables/columns/FKs change (same PR as Alembic).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#f4f6f8"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1f2937">Clean My Car — Database ER Diagram</text>
  <text x="24" y="52" font-size="12" fill="#6b7280">Modules 1–5 · size_tier on vehicle_models (ops); users pick model_id only</text>

  <!-- cities -->
  <g id="table-cities">
    <rect x="40" y="80" width="240" height="200" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="40" y="80" width="240" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="40" y="96" width="240" height="12" fill="#1e3a5f"/>
    <text x="160" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">cities</text>
    <line x1="40" y1="108" x2="280" y2="108" stroke="#374151"/>
    <text x="52" y="128" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="52" y="150" font-size="12" fill="#111">name, state, is_active</text>
    <text x="52" y="172" font-size="12" fill="#111">display_order</text>
    <text x="52" y="194" font-size="12" fill="#111">created_at, updated_at</text>
  </g>

  <!-- societies -->
  <g id="table-societies">
    <rect x="360" y="80" width="280" height="220" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="360" y="80" width="280" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="360" y="96" width="280" height="12" fill="#1e3a5f"/>
    <text x="500" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">societies</text>
    <line x1="360" y1="108" x2="640" y2="108" stroke="#374151"/>
    <text x="372" y="128" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="372" y="150" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  city_id → cities</text>
    <text x="372" y="172" font-size="12" fill="#111">name, address_line</text>
    <text x="372" y="194" font-size="12" fill="#111">service_weekdays int[3]</text>
    <text x="372" y="216" font-size="12" fill="#111">is_serviceable, display_order</text>
    <text x="372" y="238" font-size="12" fill="#111">created_at, updated_at</text>
  </g>

  <!-- waitlist_entries -->
  <g id="table-waitlist">
    <rect x="720" y="80" width="320" height="240" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="720" y="80" width="320" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="720" y="96" width="320" height="12" fill="#1e3a5f"/>
    <text x="880" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">waitlist_entries</text>
    <line x1="720" y1="108" x2="1040" y2="108" stroke="#374151"/>
    <text x="732" y="128" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="732" y="150" font-size="12" fill="#111"><tspan font-weight="700" fill="#7c3aed">UK</tspan> <tspan font-weight="700" fill="#0369a1">FK</tspan>  user_id null</text>
    <text x="732" y="172" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  city_id</text>
    <text x="732" y="194" font-size="12" fill="#111">society_name (free text)</text>
    <text x="732" y="216" font-size="12" fill="#111">phone, notes, status</text>
    <text x="732" y="238" font-size="12" fill="#111">created_at, updated_at</text>
    <text x="732" y="260" font-size="11" fill="#6b7280">one entry per user</text>
  </g>

  <!-- vehicle_makes -->
  <g id="table-makes">
    <rect x="1100" y="80" width="260" height="200" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="1100" y="80" width="260" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="1100" y="96" width="260" height="12" fill="#1e3a5f"/>
    <text x="1230" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">vehicle_makes</text>
    <line x1="1100" y1="108" x2="1360" y2="108" stroke="#374151"/>
    <text x="1112" y="128" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="1112" y="150" font-size="12" fill="#111"><tspan font-weight="700" fill="#7c3aed">UK</tspan>  name</text>
    <text x="1112" y="172" font-size="12" fill="#111">is_active, display_order</text>
    <text x="1112" y="194" font-size="12" fill="#111">created_at, updated_at</text>
    <text x="1112" y="216" font-size="11" fill="#6b7280">ops brand catalog</text>
  </g>

  <!-- vehicle_models -->
  <g id="table-models">
    <rect x="1100" y="320" width="260" height="230" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="1100" y="320" width="260" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="1100" y="336" width="260" height="12" fill="#1e3a5f"/>
    <text x="1230" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">vehicle_models</text>
    <line x1="1100" y1="348" x2="1360" y2="348" stroke="#374151"/>
    <text x="1112" y="368" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="1112" y="390" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  make_id</text>
    <text x="1112" y="412" font-size="12" fill="#111">name</text>
    <text x="1112" y="434" font-size="12" fill="#111">size_tier  <tspan fill="#6b7280">S/M/L ops</tspan></text>
    <text x="1112" y="456" font-size="12" fill="#111">is_active, display_order</text>
    <text x="1112" y="478" font-size="12" fill="#111">created_at, updated_at</text>
    <text x="1112" y="500" font-size="11" fill="#6b7280">source of size classification</text>
  </g>

  <!-- users -->
  <g id="table-users">
    <rect x="360" y="380" width="280" height="260" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="360" y="380" width="280" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="360" y="396" width="280" height="12" fill="#1e3a5f"/>
    <text x="500" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">users</text>
    <line x1="360" y1="408" x2="640" y2="408" stroke="#374151"/>
    <text x="372" y="428" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="372" y="450" font-size="12" fill="#111"><tspan font-weight="700" fill="#7c3aed">UK</tspan>  phone</text>
    <text x="372" y="472" font-size="12" fill="#111">name, email, is_active</text>
    <text x="372" y="494" font-size="12" fill="#111">deleted_at</text>
    <text x="372" y="516" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  city_id, society_id</text>
    <text x="372" y="538" font-size="12" fill="#111">created_at, updated_at</text>
  </g>

  <!-- vehicles -->
  <g id="table-vehicles">
    <rect x="720" y="380" width="320" height="280" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="720" y="380" width="320" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="720" y="396" width="320" height="12" fill="#1e3a5f"/>
    <text x="880" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">vehicles</text>
    <line x1="720" y1="408" x2="1040" y2="408" stroke="#374151"/>
    <text x="732" y="428" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="732" y="450" font-size="12" fill="#111"><tspan font-weight="700" fill="#7c3aed">UK</tspan> <tspan font-weight="700" fill="#0369a1">FK</tspan>  user_id</text>
    <text x="732" y="472" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  model_id → models</text>
    <text x="732" y="494" font-size="12" fill="#111">size_tier  <tspan fill="#6b7280">snapshot</tspan></text>
    <text x="732" y="516" font-size="12" fill="#111">nickname, plate_number</text>
    <text x="732" y="538" font-size="12" fill="#111">colour, parking_slot/tower</text>
    <text x="732" y="560" font-size="12" fill="#111">created_at, updated_at</text>
    <text x="732" y="582" font-size="11" fill="#6b7280">one car per user · no free size pick</text>
  </g>

  <!-- refresh_tokens -->
  <g id="table-refresh">
    <rect x="360" y="700" width="280" height="180" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="360" y="700" width="280" height="28" rx="4" fill="#1e3a5f"/>
    <rect x="360" y="716" width="280" height="12" fill="#1e3a5f"/>
    <text x="500" y="719" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">refresh_tokens</text>
    <line x1="360" y1="728" x2="640" y2="728" stroke="#374151"/>
    <text x="372" y="748" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="372" y="770" font-size="12" fill="#111"><tspan font-weight="700" fill="#0369a1">FK</tspan>  user_id CASCADE</text>
    <text x="372" y="792" font-size="12" fill="#111"><tspan font-weight="700" fill="#7c3aed">UK</tspan>  token_hash</text>
    <text x="372" y="814" font-size="12" fill="#111">expires_at, revoked_at</text>
  </g>

  <!-- otp -->
  <g id="table-otp">
    <rect x="40" y="380" width="240" height="200" rx="4" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    <rect x="40" y="380" width="240" height="28" rx="4" fill="#4b5563"/>
    <rect x="40" y="396" width="240" height="12" fill="#4b5563"/>
    <text x="160" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">otp_challenges</text>
    <line x1="40" y1="408" x2="280" y2="408" stroke="#374151"/>
    <text x="52" y="428" font-size="12" fill="#111"><tspan font-weight="700" fill="#b45309">PK</tspan>  id</text>
    <text x="52" y="450" font-size="12" fill="#111">phone, code_hash</text>
    <text x="52" y="472" font-size="12" fill="#111">expires_at, attempt_count</text>
    <text x="52" y="494" font-size="12" fill="#111">consumed_at</text>
    <text x="52" y="516" font-size="11" fill="#6b7280">no user FK</text>
  </g>

  <!-- relationship lines -->
  <line x1="280" y1="160" x2="360" y2="160" stroke="#111827" stroke-width="1.5"/>
  <text x="300" y="150" font-size="10" fill="#6b7280">CASCADE</text>

  <line x1="1230" y1="280" x2="1230" y2="320" stroke="#111827" stroke-width="1.5"/>
  <text x="1240" y="305" font-size="10" fill="#6b7280">1–N CASCADE</text>

  <line x1="640" y1="500" x2="720" y2="500" stroke="#111827" stroke-width="1.5"/>
  <text x="650" y="490" font-size="10" fill="#6b7280">1–0..1 CASCADE</text>

  <path d="M 1100 420 L 1040 460" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="1045" y="430" font-size="10" fill="#6b7280">RESTRICT</text>

  <path d="M 640 200 L 720 180" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="650" y="175" font-size="10" fill="#6b7280">city CASCADE</text>

  <!-- legend -->
  <g id="legend">
    <rect x="40" y="700" width="260" height="120" rx="4" fill="#fff" stroke="#9ca3af"/>
    <text x="55" y="722" font-size="12" font-weight="700" fill="#111">Legend</text>
    <text x="55" y="744" font-size="11" fill="#b45309" font-weight="700">PK</text>
    <text x="80" y="744" font-size="11" fill="#374151">Primary key</text>
    <text x="55" y="764" font-size="11" fill="#0369a1" font-weight="700">FK</text>
    <text x="80" y="764" font-size="11" fill="#374151">Foreign key</text>
    <text x="55" y="784" font-size="11" fill="#7c3aed" font-weight="700">UK</text>
    <text x="80" y="784" font-size="11" fill="#374151">Unique</text>
  </g>
</svg>
