# Enforce Conventional Commits on pull request titles.
# Aligns with CONTRIBUTING.md so squash-merge titles stay changelog-friendly.

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must not start with an uppercase letter.
            Example: "chore(backend): scaffold FastAPI app with Postgres"
